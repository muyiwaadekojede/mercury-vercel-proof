<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Mercury GitHub Pages Pull Request Proof</title>
    <script>
(() => {
  const fixtureId = "github-pages-pr-live";
  const runId = "mp8ahok3";
  const collectorUrl = "https://httpbingo.org/anything";
  const sessionId = "github-pages-pr-live-" + runId;
  window.__MERCURY_PROOF_SESSION_ID__ = sessionId;
  const payload = {
    fixtureId,
    sessionId,
    type: "github_pages_pr_loaded",
    runId,
    page: location.href
  };

  Promise.all([
    fetch(collectorUrl + "?kind=heartbeat&fixtureId=" + encodeURIComponent(fixtureId) + "&sessionId=" + encodeURIComponent(sessionId), {
      method: "GET",
      mode: "cors"
    }),
    fetch(collectorUrl, {
      method: "POST",
      mode: "cors",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    })
  ]).then(async ([heartbeatResponse, eventResponse]) => {
    const eventEcho = await eventResponse.json();
    window.__MERCURY_PROOF_EVIDENCE__ = {
      fixtureId,
      sessionId,
      heartbeatOk: heartbeatResponse.ok,
      eventOk: eventResponse.ok,
      heartbeatStatus: heartbeatResponse.status,
      eventStatus: eventResponse.status,
      eventMethod: String(eventEcho.method || "")
    };
  }).catch((error) => {
    window.__MERCURY_PROOF_EVIDENCE__ = {
      fixtureId,
      sessionId,
      heartbeatOk: false,
      eventOk: false,
      heartbeatStatus: 0,
      eventStatus: 0,
      eventMethod: String(error && error.message ? error.message : error)
    };
  });
})();
</script>
  </head>
  <body>
    <main>
      <h1>Mercury GitHub Pages Pull Request Proof</h1>
      <p data-proof-run="mp8ahok3">This page proves the GitHub Pages pull-request setup route.</p>
    </main>
  </body>
</html>
